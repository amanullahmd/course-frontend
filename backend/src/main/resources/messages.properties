# Sprachweg messages, English (fallback). German: messages_de.properties.
# Note: messages with arguments are formatted with java.text.MessageFormat (avoid single quotes).

# ---------------------------------------------------------------- errors: generic / HTTP
error.BAD_REQUEST=The request is invalid.
error.BAD_REQUEST.missingParameter=Required parameter "{0}" is missing.
error.BAD_REQUEST.missingHeader=Required header "{0}" is missing.
error.BAD_REQUEST.missingCookie=Required cookie "{0}" is missing.
error.BAD_REQUEST.rejectedUrl=The request URL is not allowed.
error.MALFORMED_REQUEST=The request body is missing or is not valid JSON of the expected shape.
error.INVALID_PARAMETER=The value of parameter "{0}" is invalid.
error.VALIDATION_FAILED=Some fields are invalid. Please check your input.
error.UNAUTHORIZED=Please log in to continue.
error.FORBIDDEN=You are not allowed to perform this action.
error.NOT_FOUND=The requested resource was not found.
error.METHOD_NOT_ALLOWED=This HTTP method is not supported for this URL.
error.NOT_ACCEPTABLE=The requested response format is not supported.
error.CONFLICT=The request conflicts with existing data.
error.CONCURRENT_MODIFICATION=The data was changed at the same time by someone else. Please try again.
error.UNSUPPORTED_MEDIA_TYPE=This content type is not supported for this request.
error.FILE_REQUIRED=Please upload a file (multipart/form-data, field "file").
