spring:
  application:
    name: sprachweg-backend
  config:
    # Local secrets (RESEND_API_KEY, MAIL_FROM, MAIL_ENABLED …) can live in a git-ignored backend/.env file.
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_REQUEST_SIZE:510MB}
      file-size-threshold: 2MB
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      add-mappings: false
  jackson:
    default-property-inclusion: always
  mail:
    # Resend SMTP (https://resend.com/docs/send-with-smtp). Override MAIL_* for other providers / Mailpit.
    default-encoding: UTF-8
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${RESEND_API_KEY:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Only check the SMTP server when e-mails are actually sent (MAIL_ENABLED); otherwise an unreachable
      # SMTP host would report the whole application as DOWN although it never talks to it.
      enabled: ${app.mail.enabled:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  frontend-url: http://localhost:3000
  public-base-url: http://localhost:8080
  jwt:
    # Development default only. Production MUST override via JWT_SECRET (>= 32 chars).
    secret: dev-only-jwt-secret-change-me-0123456789abcdef
    issuer: sprachweg
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  auth:
    email-verification-ttl: 24h
    password-reset-ttl: 1h
    refresh-cookie-name: refresh_token
    secure-cookie: false
    cookie-same-site: Lax
  media:
    # Development default only. Production MUST override via MEDIA_SECRET (>= 32 chars).
    secret: dev-only-media-secret-change-me-0123456789abcdef
    url-ttl: 6h
  storage:
    location: ./data/uploads
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: "${MAIL_FROM:Sprachweg <no-reply@course.amanullah.me>}"
  cors:
    allowed-origins:
      - http://localhost:3000
  seed:
    enabled: false
