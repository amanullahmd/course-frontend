spring:
  application:
    name: sprachweg-backend
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_UPLOAD_SIZE:500MB}
      file-size-threshold: 2MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always
  mail:
    default-encoding: UTF-8

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  frontend-url: http://localhost:3000
  public-base-url: http://localhost:8080
  jwt:
    # Development default only. Production MUST override via JWT_SECRET (>= 32 chars).
    secret: dev-only-jwt-secret-change-me-0123456789abcdef
    issuer: sprachweg
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  auth:
    email-verification-ttl: 24h
    password-reset-ttl: 1h
    refresh-cookie-name: refresh_token
    secure-cookie: false
    cookie-same-site: Lax
  media:
    # Development default only. Production MUST override via MEDIA_SECRET (>= 32 chars).
    secret: dev-only-media-secret-change-me-0123456789abcdef
    url-ttl: 6h
  storage:
    location: ./data/uploads
  mail:
    enabled: false
    from: "Sprachweg <no-reply@sprachweg.local>"
  cors:
    allowed-origins:
      - http://localhost:3000
  seed:
    enabled: false
