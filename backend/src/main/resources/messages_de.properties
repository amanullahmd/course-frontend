# Sprachweg-Meldungen, Deutsch (du-Form).
# Hinweis: Meldungen mit Argumenten werden mit java.text.MessageFormat formatiert (keine einfachen Anführungszeichen).

# ---------------------------------------------------------------- Fehler: allgemein / HTTP
error.BAD_REQUEST=Die Anfrage ist ungültig.
error.BAD_REQUEST.missingParameter=Der Parameter „{0}“ fehlt.
error.BAD_REQUEST.missingHeader=Der Header „{0}“ fehlt.
error.BAD_REQUEST.missingCookie=Das Cookie „{0}“ fehlt.
error.BAD_REQUEST.rejectedUrl=Diese Anfrage-URL ist nicht erlaubt.
error.MALFORMED_REQUEST=Der Anfrageinhalt fehlt oder ist kein gültiges JSON in der erwarteten Form.
error.INVALID_PARAMETER=Der Wert des Parameters „{0}“ ist ungültig.
error.VALIDATION_FAILED=Einige Felder sind ungültig. Bitte überprüfe deine Eingaben.
error.UNAUTHORIZED=Bitte melde dich an, um fortzufahren.
error.FORBIDDEN=Du darfst diese Aktion nicht ausführen.
error.NOT_FOUND=Die angeforderte Ressource wurde nicht gefunden.
error.METHOD_NOT_ALLOWED=Diese HTTP-Methode wird für diese URL nicht unterstützt.
error.NOT_ACCEPTABLE=Das angeforderte Antwortformat wird nicht unterstützt.
error.CONFLICT=Die Anfrage steht im Konflikt mit vorhandenen Daten.
error.CONCURRENT_MODIFICATION=Die Daten wurden gleichzeitig von jemand anderem geändert. Bitte versuche es erneut.
error.UNSUPPORTED_MEDIA_TYPE=Dieser Inhaltstyp wird für diese Anfrage nicht unterstützt.
error.FILE_REQUIRED=Bitte lade eine Datei hoch (multipart/form-data, Feld „file“).
error.FILE_EMPTY=Bitte wähle eine Datei, die nicht leer ist.
error.FILE_TOO_LARGE=Die hochgeladene Datei ist zu groß.
error.SERVICE_UNAVAILABLE=Der Dienst ist vorübergehend nicht verfügbar. Bitte versuche es später erneut.
error.CLIENT_ERROR=Die Anfrage konnte nicht verarbeitet werden.
error.INTERNAL_ERROR=Ein unerwarteter Fehler ist aufgetreten. Bitte versuche es später erneut.

# ---------------------------------------------------------------- Fehler: nicht gefunden
error.COURSE_NOT_FOUND=Kurs nicht gefunden.
error.MODULE_NOT_FOUND=Modul nicht gefunden.
error.ITEM_NOT_FOUND=Inhalt nicht gefunden.
error.MEDIA_NOT_FOUND=Datei nicht gefunden.
